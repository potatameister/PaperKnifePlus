[versions]
agp = "8.5.0"
kotlin = "2.0.0"
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.1"
activityCompose = "1.9.0"
composeBom = "2024.06.00"
pdfbox = "2.0.27.0"
coil = "2.6.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"

[libraries]
# Use unique keys to avoid shadowing
cmp-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
cmp-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
cmp-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
cmp-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
cmp-ui = { group = "androidx.compose.ui", name = "ui" }
cmp-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
cmp-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
cmp-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
cmp-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
cmp-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
cmp-material3 = { group = "androidx.compose.material3", name = "material3" }
cmp-pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }
cmp-coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
cmp-junit = { group = "junit", name = "junit", version.ref = "junit" }
cmp-androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
cmp-androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
