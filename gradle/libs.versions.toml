[versions]
agp = "8.5.0"
kotlin = "2.0.0"
coreKtx = "1.13.1"
lifecycle = "2.8.1"
activity = "1.9.0"
bom = "2024.06.00"
pdfbox = "2.0.27.0"
coil = "2.6.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espresso = "3.5.1"

[libraries]
corektx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
composebom = { group = "androidx.compose", name = "compose-bom", version.ref = "bom" }
ui = { group = "androidx.compose.ui", name = "ui" }
graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
