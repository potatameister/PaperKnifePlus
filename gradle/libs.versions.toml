pdfbox = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }
coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
testjunit = { group = "junit", name = "junit", version.ref = "junit" }
testext = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
testespresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
