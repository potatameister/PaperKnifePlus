name: Build PaperKnife+

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Build Release APK
      run: |
        gradle clean assembleRelease --stacktrace --no-daemon --console=plain
        echo "=== RELEASE APK SIZE ==="
        ls -lh app/build/outputs/apk/release/app-release-unsigned.apk || ls -lh app/build/outputs/apk/release/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: PaperKnifePlus-Release
        path: app/build/outputs/apk/release/*.apk
