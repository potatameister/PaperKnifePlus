name: Build PaperKnife+

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cleanup Workspace
      run: rm -rf PaperKnife-reference

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Generate Wrapper
      run: gradle wrapper

    - name: Build
      run: ./gradlew clean assembleDebug assembleRelease --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: PaperKnifePlus-Debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK (Unsigned)
      uses: actions/upload-artifact@v4
      with:
        name: PaperKnifePlus-Release-Unsigned
        path: app/build/outputs/apk/release/app-release-unsigned.apk
