name: Build PaperKnife+

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set SOURCE_DATE_EPOCH
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "build-tools;34.0.0"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Build Release APK and AAB
      run: |
        gradle clean assembleRelease bundleRelease --stacktrace --no-daemon --console=plain

    - name: Sign and Zipalign
      run: |
        # Locate tools
        ZIPALIGN=$ANDROID_HOME/build-tools/34.0.0/zipalign
        APKSIGNER=$ANDROID_HOME/build-tools/34.0.0/apksigner
        
        # Zipalign
        $ZIPALIGN -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-aligned.apk
        
        # Sign
        echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks
        $APKSIGNER sign --ks keystore.jks \
          --ks-key-alias "${{ secrets.ALIAS }}" \
          --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" \
          --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
          --out app/build/outputs/apk/release/PaperKnife+.apk \
          app/build/outputs/apk/release/app-release-aligned.apk
        
        # Cleanup
        rm keystore.jks

    - name: Log APK Size
      run: |
        echo "=== SIGNED RELEASE APK SIZE ==="
        ls -lh app/build/outputs/apk/release/PaperKnife+.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: PaperKnifePlus-Release-APK
        path: app/build/outputs/apk/release/PaperKnife+.apk

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: PaperKnifePlus-Release-AAB
        path: app/build/outputs/bundle/release/app-release.aab
