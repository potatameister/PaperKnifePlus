name: Build PaperKnife+

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "build-tools;34.0.0"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Build Release APK
      run: |
        gradle clean assembleRelease --stacktrace --no-daemon --console=plain

    - name: Sign Android Release
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
        buildToolsVersion: 34.0.0

    - name: Log APK Size
      run: |
        echo "=== SIGNED RELEASE APK SIZE ==="
        ls -lh ${{ steps.sign_app.outputs.signedReleaseFile }}

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: PaperKnifePlus-Release
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
